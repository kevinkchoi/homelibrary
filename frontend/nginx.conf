# 로그인·가입 시도 횟수 제한 — 인터넷에 공개하면서 넣었다.
# 없으면 비밀번호를 무한정 대입해 볼 수 있다.
#
# 키를 그냥 $remote_addr로 두면 안 된다: Cloudflare 터널로 들어온 요청은 전부
# cloudflared 컨테이너 IP 하나로 보여서, 바깥 사람 한 명이 가족 전원의 로그인을 막게 된다.
# Cloudflare가 붙여 주는 CF-Connecting-IP(진짜 접속자, 바깥에서 위조해 보내도 Cloudflare가
# 덮어쓴다)를 쓰고, 없으면(LAN·Tailscale 직접 접속) $remote_addr를 쓴다.
map $http_cf_connecting_ip $login_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# 분당 10회, 처음 5번까지는 몰아서 허용 — 사람이 오타 몇 번 내는 것은 걸리지 않는다.
limit_req_zone $login_client zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 이미지/엑셀 업로드 대비 업로드 용량 상향
    client_max_body_size 25m;

    # [새책 추천]만 따로 둔다 — 알라딘 여러 번 + Claude 한 번이라 한 번 만드는 데
    # **1분 남짓** 걸린다. nginx 기본 proxy_read_timeout은 60초라서 그대로 두면
    # 갱신이 504로 끊긴다(실측 90초). 전역으로 올리지 않는 이유는, 다른 화면이
    # 멈췄을 때 60초 안에 끊기는 편이 원인을 빨리 드러내기 때문이다.
    # prefix가 더 긴 location이 이기므로 아래 /api/ 보다 먼저 잡힌다(순서 무관).
    location /api/recommendations {
        proxy_pass http://homelibrary-api:8000/api/recommendations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # login·register만 횟수 제한(위 limit_req_zone). 넘치면 429.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://homelibrary-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://homelibrary-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA service worker/manifest는 캐시하지 않도록
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 안드로이드 앱(APK) 내려받기. nginx 기본 mime.types에는 apk가 없어서
    # 지정하지 않으면 브라우저가 형식을 몰라 엉뚱하게 처리할 수 있다.
    location = /app/HomeLibrary.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="HomeLibrary.apk"';
        # 새 APK를 올렸는데 옛 파일이 내려가면 안 되므로 캐시하지 않는다.
        add_header Cache-Control "no-cache";
    }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
