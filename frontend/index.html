<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c5f8a" />
    <title>Home Library</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- 아이폰에서 "홈 화면에 추가"했을 때 **주소창 없이 앱처럼** 뜨게 한다.
         iOS Safari는 매니페스트의 `display: standalone`을 따르지 않고 이 메타 태그를 본다.
         없으면 아이콘을 눌러도 그냥 Safari 창이 열려 "앱 같지 않다"는 느낌이 된다.
         (2026-09-27에 빠져 있는 것을 발견) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent`로 두면 내용이 상태 표시줄 **밑으로 들어간다.** 상단 바가
         sticky top:0이라 시계와 겹치므로 `default`(상태 표시줄 아래에서 시작)로 둔다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 홈 화면에 표시될 이름. 안 적으면 <title>을 쓰는데, 화면마다 title이 바뀌면
         이름도 흔들린다. 고정해 둔다. -->
    <meta name="apple-mobile-web-app-title" content="Home Library" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
